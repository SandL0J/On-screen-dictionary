name: Release - Paketleme ve Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Sürüm numarası (örn. 0.9.0)'
        required: true
        default: '0.9.0'

jobs:
  build-installer:
    name: Build Windows x64 Executable & Setup Installer
    runs-on: windows-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python 3.12 Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Bağımlılıkları ve Paketleme Araçlarını Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Inno Setup Kur (Chocolatey)
        run: |
          choco install innosetup --no-progress -y

      - name: Uygulama İkonunu Üret (Çoklu Çözünürlük .ico)
        run: |
          python packaging/generate_icon.py

      - name: PyInstaller ile Bağımsız Paket Derle
        run: |
          pyinstaller --noconfirm --clean packaging/ekran_sozlugu.spec

      - name: Inno Setup ile Kurulum Dosyası (.exe) Üret
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging/setup.iss

      - name: SHA-256 Sağlama Toplamı (Checksum) Üret
        run: |
          cd dist
          Get-FileHash -Algorithm SHA256 EkranSozlugu-Setup-*.exe | Select-Object -Property Hash, Path | Format-Table -AutoSize > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Kurulum Paketini Yapı Yapıtı (Artifact) Olarak Sakla
        uses: actions/upload-artifact@v4
        with:
          name: EkranSozlugu-Windows-Installer
          path: |
            dist/EkranSozlugu-Setup-*.exe
            dist/SHA256SUMS.txt

      - name: GitHub Release Taslağı Oluştur
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/EkranSozlugu-Setup-*.exe
            dist/SHA256SUMS.txt
