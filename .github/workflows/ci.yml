name: CI - Test Matrix & Kalite Denetimi

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python Yapılandır (${{ matrix.python-version }})
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sözdizimi ve Bytecode Derleme Doğrulaması
        run: |
          python -m compileall -q app tests main.py

      - name: Test Paketini Çalıştır (İzole ve Ağsız)
        env:
          EKRAN_SOZLUGU_OFFLINE_TEST: "1"
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
